name: '[Dependabot NuGet] Build .NET'

on:
  push:
    branches:
      - 'dependabot/nuget/**'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_CERT_REVOCATION_MODE: offline

jobs:

  net-test:
    name: .NET tests (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17, 18, 19]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Build .NET solution
      run: dotnet build --configuration Release --no-restore -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Run .NET tests
      run: dotnet test --no-build --configuration Release --no-progress -p:UmbracoMajorVersion=${{ matrix.umbraco }}

  net-build:
    name: .NET build (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    needs: [ net-test ]
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17, 18, 19]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Publish application
      run: dotnet pack src/Shorthand.UmbracoHelpers/Shorthand.UmbracoHelpers.csproj --configuration Release --no-restore --output artifacts -p:UmbracoMajorVersion=${{ matrix.umbraco }}
