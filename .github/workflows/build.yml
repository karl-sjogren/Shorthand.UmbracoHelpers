name: 'Build and publish application'

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'copilot/**'
    tags:
      - '17.*'
      - '18.*'
    paths-ignore:
      - 'README.md'
      - 'docs/*'
      - 'scripts/*'
      - '.vscode/*'

permissions:
  checks: write
  contents: write
  pull-requests: write
  actions: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_CERT_REVOCATION_MODE: offline
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  PUBLISH_CODECOV: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/main')

jobs:

  net-test:
    name: .NET tests (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17, 18, 19]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Build .NET solution
      run: dotnet build --configuration Release --no-restore -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Run .NET tests
      run: dotnet test --coverage --coverage-output-format cobertura --coverage-settings ./test/coverage.config --report-trx --no-build --configuration Release --no-progress -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: net-test-results-${{ matrix.umbraco }}
        path: |
          ./**/*.trx
          ./**/*.cobertura.xml

  test-and-coverage-results:
    name: Publish test and coverage results
    runs-on: ubuntu-latest

    needs: [ net-test ]

    steps:
    # While we don't use sources directly in this job the test reporter wants to check
    # some files through git so we need the sources.
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Download .NET tests results
      uses: actions/download-artifact@v8
      with:
        pattern: net-test-results-*
        path: ./test-results

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: './**/*.cobertura.xml;./**/cobertura-coverage.xml'
        targetdir: 'coverage-report'
        reporttypes: 'Html;MarkdownSummary;MarkdownDeltaSummary;Cobertura'
        assemblyfilters: '-xunit*'
        verbosity: 'Info'

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-report

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      # To save on uploads, only upload coverage from the main branches and PRs
      if: env.PUBLISH_CODECOV
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage-report/Cobertura.xml

  net-build:
    name: .NET build (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17, 18, 19]

    needs: [ net-test ]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      run: dotnet restore --verbosity minimal -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Pack project
      run: dotnet pack src/Shorthand.UmbracoHelpers/Shorthand.UmbracoHelpers.csproj --configuration Release --no-restore --output artifacts -p:UmbracoMajorVersion=${{ matrix.umbraco }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: publish-artifacts-${{ matrix.umbraco }}
        path: ./artifacts/
        if-no-files-found: error


  publish:
    name: NuGet Publish
    needs: net-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      id-token: write
      contents: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Validate release tag
      id: version
      shell: bash
      run: |
        tag="${GITHUB_REF_NAME}"
        if [[ ! "$tag" =~ ^(17|18)\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid release tag: $tag" >&2
          exit 1
        fi
        git fetch origin main
        git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
        echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"
        echo "version=$tag" >> "$GITHUB_OUTPUT"

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Verify configured package version
      shell: bash
      run: |
        version=$(dotnet msbuild src/Shorthand.UmbracoHelpers/Shorthand.UmbracoHelpers.csproj -getProperty:Version -p:UmbracoMajorVersion=${{ steps.version.outputs.major }})
        test "$version" = "${{ steps.version.outputs.version }}"

    - name: Download selected package
      uses: actions/download-artifact@v8
      with:
        name: publish-artifacts-${{ steps.version.outputs.major }}
        path: ./artifacts/

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_PROFILE }}

    - name: Publish package to NuGet.org
      run: dotnet nuget push ./artifacts/Shorthand.UmbracoHelpers.${{ steps.version.outputs.version }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      working-directory: ./

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        make_latest: ${{ steps.version.outputs.major == '17' && 'false' || 'legacy' }}
